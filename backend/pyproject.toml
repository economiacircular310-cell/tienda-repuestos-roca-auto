[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lenin-auto"
version = "2.1.1"
description = "Motor de catálogo, búsqueda y confianza de Lenin Auto Cars"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
lenin-auto = "lenin_auto.cli:main"

[tool.setuptools.packages.find]
include = ["lenin_auto*"]

[tool.setuptools.package-data]
lenin_auto = ["catalog/*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
