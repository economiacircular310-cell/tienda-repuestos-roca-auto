# /etc/nginx/sites-available/lenin-auto  (cambia TU_DOMINIO por tu dominio)
# Después: sudo certbot --nginx -d TU_DOMINIO -d www.TU_DOMINIO   (agrega HTTPS solo)
server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO www.TU_DOMINIO;

    client_max_body_size 1m;

    # Archivos de la interfaz: llevan un hash en el nombre, se pueden guardar un año.
    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # Se sobrescribe (no se agrega): el cliente no puede falsear su IP ante el limitador.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
